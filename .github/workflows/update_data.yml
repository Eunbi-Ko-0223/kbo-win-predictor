name: Update KBO standings

# 매일 한국시간 오전 7시(UTC 22:00)에 현재 성적을 크롤링해 커밋
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼도 제공

permissions:
  contents: write           # 갱신된 CSV를 푸시하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Crawl latest standings
        run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_standings.csv
          git diff --staged --quiet || git commit -m "chore: auto-update standings"
          git push
